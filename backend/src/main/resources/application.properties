spring.application.name=sprint-planning

# --- Datasource (env-overridable; no secrets committed) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/sprint_planning}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates the mapping against it.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# Base64-encoded HMAC secret. Override JWT_SECRET in every real environment.
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyEh}
app.jwt.issuer=sprint-planning
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D

# --- OTP ---
app.otp.length=6
app.otp.ttl=PT10M
app.otp.max-attempts=5
app.otp.resend-cooldown=PT60S
# delivery: console (logs the code) or smtp (sends email)
app.otp.delivery=${OTP_DELIVERY:console}
app.otp.from-address=${OTP_FROM:no-reply@trackflows.app}

# --- Mail (used when app.otp.delivery=smtp) ---
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# --- Google OAuth 2.0 (Spring oauth2Login redirect flow) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# --- App / CORS / frontend ---
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
