# Test config: in-memory H2 (MySQL compatibility mode), schema from Hibernate, Flyway off.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

app.jwt.secret=dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtMzJieXRlcw==
app.jwt.issuer=sprint-planning-test
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D

app.otp.length=6
app.otp.ttl=PT10M
app.otp.max-attempts=5
app.otp.resend-cooldown=PT60S
app.otp.delivery=console
app.otp.from-address=test@trackflows.app

app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
